<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Game | Achievement Planner</title>

    <!-- Per-game pages are JavaScript-rendered (game.html?slug=...): no
         crawlable server-side content or per-page metadata, and the bare
         URL is not a real page. Keep the whole route out of the index for
         now; `follow` so the in-page links stay crawlable. Revisit if
         these pages ever get pre-rendered. -->
    <meta name="robots" content="noindex, follow">

    <link rel="icon" type="image/svg+xml" href="src/assets/favicon.svg">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="src/css/style.css">

</head>

<body>

<a href="#main-content" class="skip-link">Skip to main content</a>

<div id="navbar"></div>

<main id="main-content" tabindex="-1">

    <section class="game-page">

        <div class="container">

            <div
    id="game-content"
    class="game-container"
></div>

        </div>

    </section>

</main>

<script type="module" src="src/js/game.js"></script>

</body>

</html>
