<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Achievement Planner</title>

    <meta name="description" content="Plan your Steam achievements smarter. Discover the fastest and most efficient way to complete every Steam game.">

    <link rel="canonical" href="https://muchochicle.github.io/AchievementPlanner/">

    <!-- Google Search Console ownership verification (HTML-tag method) for
         the URL-prefix property https://muchochicle.github.io/AchievementPlanner/ .
         Keep this tag in place - removing it un-verifies the property.
         Full runbook: dev-notes/SEARCH_CONSOLE.md -->
    <meta name="google-site-verification" content="I8bnZFbpoCst5WlczciztwEBQNwY7ozz0fU6sVDkZbw">

    <link rel="icon" type="image/svg+xml" href="src/assets/favicon.svg">

    <meta property="og:type" content="website">
    <meta property="og:site_name" content="Achievement Planner">
    <meta property="og:title" content="Achievement Planner">
    <meta property="og:description" content="Plan your Steam achievements smarter. Discover the fastest and most efficient way to complete every Steam game.">
    <meta property="og:url" content="https://muchochicle.github.io/AchievementPlanner/">
    <meta property="og:image" content="https://muchochicle.github.io/AchievementPlanner/src/assets/og-image.svg">
    <meta name="twitter:card" content="summary_large_image">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="src/css/style.css">

</head>

<body>

<a href="#main-content" class="skip-link">Skip to main content</a>

<div id="navbar"></div>

<main id="main-content" tabindex="-1">

<div id="login-error-slot"></div>

<section class="hero">

    <div class="container">

        <h1>
    Plan your Steam<br>
    achievements smarter.
</h1>

        <p>
            Discover the fastest and most efficient way to complete every Steam game.
        </p>

        <div class="search-wrapper">

    <input
        type="text"
        aria-label="Search any Steam game"
        placeholder="Search any Steam game..."
    >

    <div class="search-results"></div>

</div>

        <div class="hero-stats">

            <div class="hero-stat">

                <strong id="hero-stat-games">…</strong>

                <span>Games</span>

            </div>

            <div class="hero-stat">

                <strong id="hero-stat-planners">…</strong>

                <span>Planners Available</span>

            </div>

        </div>

        <p id="catalog-error" class="state-message" hidden>
            We couldn't load the games catalog right now. Please try again later.
        </p>

    </div>

</section>

<section class="popular-games">

    <div class="container">

        <h2>Popular Games</h2>

        <div id="games-container"></div>

    </div>

</section>

</main>

<footer>

    <p>© Achievement Planner</p>

</footer>

<script type="module" src="src/js/app.js"></script>

</body>

</html>
