<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <!-- Provisional Open Graph / social share image (1200x630). Solid app
       background with the site name + the homepage tagline. No brand mark
       yet - replace with a designed image when available. Some older
       scrapers prefer PNG/JPG; to rasterise:
         (any SVG->PNG tool)  og-image.svg  ->  og-image.png
       then point og:image at the .png. -->
  <rect width="1200" height="630" fill="#0F172A"/>
  <rect x="0" y="0" width="1200" height="8" fill="#38BDF8"/>
  <text x="80" y="300" fill="#F8FAFC" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="84" font-weight="800">Achievement Planner</text>
  <text x="80" y="372" fill="#A3AFC2" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="36" font-weight="400">Discover the fastest way to complete every Steam game.</text>
</svg>
