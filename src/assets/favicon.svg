<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- Provisional favicon. No brand icon asset exists yet (the repo's
       logo/icon SVGs are empty placeholders), so this reuses only what IS
       the current identity: the app palette (background #0F172A, primary
       #38BDF8) and the "Achievement Planner" wordmark, reduced to its
       initials. Replace with a real brand icon when one is designed. -->
  <rect width="32" height="32" rx="7" fill="#0F172A"/>
  <text x="16" y="22" text-anchor="middle"
        font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif"
        font-size="16" font-weight="800" fill="#38BDF8">AP</text>
</svg>
